# GenzoParis の Cargo workspace。
# crate の構成と依存の向きは docs/04_architecture.md の 1.4 節を正とする。

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"
repository = "https://github.com/tokamocchi/GenzoParis"
publish = false

[workspace.dependencies]
# 内部 crate
genzo-model = { path = "crates/genzo-model" }
genzo-color = { path = "crates/genzo-color" }
genzo-raw = { path = "crates/genzo-raw" }
genzo-media = { path = "crates/genzo-media" }
genzo-pipeline = { path = "crates/genzo-pipeline" }
genzo-gpu = { path = "crates/genzo-gpu" }
genzo-catalog = { path = "crates/genzo-catalog" }
genzo-jobs = { path = "crates/genzo-jobs" }
genzo-worker = { path = "crates/genzo-worker" }
genzo-api = { path = "crates/genzo-api" }
genzo-geo = { path = "crates/genzo-geo" }
genzo-testkit = { path = "crates/genzo-testkit" }

# シリアライズ・ハッシュ
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
hex = "0.4.3"
blake3 = "1.8.7"

# エラー
thiserror = "2.0.21"
anyhow = "1.0.104"

# 日時・文字列
chrono = { version = "0.4.45", features = ["serde"] }
unicode-normalization = "0.1.25"

# 色管理・画像の入出力
# lcms2 は同梱のソース（Little CMS 2）から常にビルドする（static）。既定のままだと、pkg-config で
# システムの lcms2 が見つかる環境（Ubuntu の apt、macOS の Homebrew）ではその版に動的リンクし、
# OS ごとに Little CMS の版が変わるため（docs/third_party.md）。
lcms2 = { version = "6.2.0", features = ["static"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
tiff = "0.11.3"
png = "0.18.1"
kamadak-exif = "0.6.1"
# フォントのファイル（TrueType・OpenType・そのコレクション）の解析。透かしの文字（EXP-03）の形を読む。描画（ラスタライズ）は
# genzo-media の自前のコード。Google Fonts の fontations の crate（read-fonts・font-types を使う）。以前の ttf-parser は
# 保守の終了（RUSTSEC-2026-0192）のため置き換えた（決定事項ログ No.173）。使うのは std だけ（既定の autohint_shaping は
# 自動ヒンティングの機能で、ヒンティングをしないので使わない）。0.48.0 は公開から 2 週間たっていないため 0.47.0。
# docs/third_party.md。
skrifa = { version = "0.47.0", default-features = false, features = ["std"] }

# カタログ（SQLite を同梱してビルドする。backup はオンラインバックアップ API 用。04 の 3.4 節）
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }

# 並行処理・プロセス間の受け渡し
rayon = "1.12.0"
crossbeam-channel = "0.5.17"
parking_lot = "0.12.5"
memmap2 = "0.9.11"

# ファイル操作
tempfile = "3.27.0"
same-file = "1.0.6"
trash = "5.2.9"

# GPU
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }

# オンラインの地図（LIB-21 の第 2 段階）の HTTPS。地図のタイルと地名の検索を、利用者が有効にしたときだけ取る。
# 使うのは genzo-geo だけ（docs/04_architecture.md の 3.16 節）。ureq は同期の HTTP/1.1 のクライアント（タイル専用の
# スレッドと spawn_blocking で使うので非同期の実行環境は要らない）。TLS は ureq の公開の API の rustls で、暗号の実装は
# ring、証明書の検証は OS（rustls-platform-verifier。Windows は CryptoAPI、macOS は Security.framework、Linux は OS の
# 証明書の保管場所）に任せる。ureq の既定の機能（rustls）は webpki-roots（CDLA-Permissive-2.0。deny.toml で許して
# いない）を入れるので切り、rustls-no-provider と platform-verifier を選ぶ。ring は rustls を直接の依存にして機能で選ぶ
# （ureq の機能 rustls は webpki-roots も入れるため。aws-lc-rs は入れない）。genzo-geo の UreqClient を作るときに、
# プロセスの既定の暗号の実装として ring を入れる（crates/genzo-geo/src/http.rs）。プロキシの設定（環境変数と
# Windows のレジストリ）は genzo-geo が自分で読む（crates/genzo-geo/src/proxy.rs。ureq の機能 win-system-proxy は、
# Windows のプロトコルごとのプロキシの設定を読めずに直接つなぐので入れない）。ureq 3.4.2 は 2026-09-13、rustls
# 0.23.45 は 2026-09-14 の公開（rustls の最新の 0.23.46 は 2026-10-14 の公開で 2 週間たっていないため、0.23.45 に
# 固定する）。docs/third_party.md。
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

# CLI・ログ
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# ビルド（LibRaw の FFI 用。genzo-raw の build.rs）
cc = "1.6.0"
pkg-config = "0.3.34"

# テスト
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
