# GenzoParis の Cargo workspace。
# crate の構成と依存の向きは docs/04_architecture.md の 1.4 節を正とする。

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"
repository = "https://github.com/tokamocchi/GenzoParis"
publish = false

[workspace.dependencies]
# 内部 crate
genzo-model = { path = "crates/genzo-model" }
genzo-color = { path = "crates/genzo-color" }
genzo-raw = { path = "crates/genzo-raw" }
genzo-media = { path = "crates/genzo-media" }
genzo-pipeline = { path = "crates/genzo-pipeline" }
genzo-gpu = { path = "crates/genzo-gpu" }
genzo-catalog = { path = "crates/genzo-catalog" }
genzo-jobs = { path = "crates/genzo-jobs" }
genzo-worker = { path = "crates/genzo-worker" }
genzo-api = { path = "crates/genzo-api" }
genzo-testkit = { path = "crates/genzo-testkit" }

# シリアライズ・ハッシュ
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
hex = "0.4.3"
blake3 = "1.8.7"

# エラー
thiserror = "2.0.21"
anyhow = "1.0.104"

# 日時・文字列
chrono = { version = "0.4.45", features = ["serde"] }
unicode-normalization = "0.1.25"

# 色管理・画像の入出力
# lcms2 は同梱のソース（Little CMS 2）から常にビルドする（static）。既定のままだと、pkg-config で
# システムの lcms2 が見つかる環境（Ubuntu の apt、macOS の Homebrew）ではその版に動的リンクし、
# OS ごとに Little CMS の版が変わるため（docs/third_party.md）。
lcms2 = { version = "6.2.0", features = ["static"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
tiff = "0.11.3"
png = "0.18.1"
kamadak-exif = "0.6.1"

# カタログ（SQLite を同梱してビルドする。backup はオンラインバックアップ API 用。04 の 3.4 節）
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }

# 並行処理・プロセス間の受け渡し
rayon = "1.12.0"
crossbeam-channel = "0.5.17"
parking_lot = "0.12.5"
memmap2 = "0.9.11"

# ファイル操作
tempfile = "3.27.0"
same-file = "1.0.6"
trash = "5.2.9"

# GPU
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }

# CLI・ログ
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# ビルド（LibRaw の FFI 用。genzo-raw の build.rs）
cc = "1.6.0"
pkg-config = "0.3.34"

# テスト
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
