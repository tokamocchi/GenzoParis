[package]
name = "genzo-geo"
description = "GenzoParis のオンラインの地図の通信（地図のタイルのキャッシュと地名の検索。LIB-21 の第 2 段階）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# 検索の結果の座標の範囲の検査（GpsCoord）。
genzo-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# HTTP の日付（Expires・Date）とキャッシュの期限。
chrono.workspace = true
# 検索語の正規化（NFC。結果のキャッシュのキー）。
unicode-normalization.workspace = true
# タイルの提供元ごとのキャッシュのフォルダの名前（URL のひな形のハッシュ）。blake3 でなく sha2 なのは、
# C のビルドが要らないため（足した時点では、Linux から Windows・macOS 向けの型の検査ができた。TLS の ring を
# 入れた後は、ring の C のビルドのため、この crate も Linux からは検査できない）。
sha2.workspace = true
hex.workspace = true
# タイルのキャッシュの書き込み（同じフォルダの一時ファイル → 名前の変更）。
tempfile.workspace = true
# HTTPS のクライアント（TLS は ureq の rustls。暗号の実装は ring、証明書の検証は OS。理由はルートの Cargo.toml の注）。
# rustls は、プロセスの既定の暗号の実装（ring）を入れるためだけに直接使う（src/http.rs）。
ureq.workspace = true
rustls.workspace = true

# Windows: レジストリのプロキシの設定（ProxyEnable・ProxyServer・ProxyOverride・AutoConfigURL）を読む（src/proxy.rs。
# ureq の機能 win-system-proxy は、プロトコルごとの形の ProxyServer を読めずに直接つなぐので使わない）。版は依存の木に
# 既にあるもの（embed-resource と同じ 0.56.0）。
[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
# OS による証明書の検証（ureq の `RootCerts::PlatformVerifier` が使う `Verifier`）を、テストで直接呼ぶ
# （src/tests/os_verifier.rs）。版と機能は ureq 3.4.2 が使うもの（Cargo.lock の 0.7.1・既定の機能なし）と同じで、
# 新しい crate は増えない。
rustls-platform-verifier = { version = "0.7.1", default-features = false }

[lints]
workspace = true
