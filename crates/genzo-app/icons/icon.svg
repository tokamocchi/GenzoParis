<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- GenzoParis のアイコンの元（tauri icon でこのファイルから各サイズを作る）。
       レンズの円と、現像のトーンカーブを図案にしたもの。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f36"/>
      <stop offset="1" stop-color="#16181c"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5b54a"/>
      <stop offset="1" stop-color="#e0603a"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#lens)" stroke-width="56"/>
  <circle cx="512" cy="512" r="196" fill="#0f1114"/>
  <path d="M332 668 C 430 660, 470 560, 512 512 S 600 360, 692 356"
        fill="none" stroke="#f3f4f6" stroke-width="40" stroke-linecap="round"/>
  <circle cx="692" cy="356" r="30" fill="#f3f4f6"/>
  <circle cx="332" cy="668" r="30" fill="#f3f4f6"/>
</svg>
