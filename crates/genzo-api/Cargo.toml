[package]
name = "genzo-api"
description = "GenzoParis のコア API（コマンド・イベント）と各サービス"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# ワーカー経由の LibRaw による RAW の展開を有効にする。LibRaw の関数を呼ぶのはワーカープロセスだけ
# （04 の 1.2 節）。
# 注意: Cargo の機能フラグは同じビルドの中で共通になるため、これを有効にすると、本体の実行ファイルが
# 使う genzo-raw でも libraw が有効になる（本体の実行ファイルも LibRaw の共有ライブラリに依存しうる）。
# 配布するアプリ（決定 No.4）では、本体はこの機能フラグなしでビルドし、ワーカーは別の実行ファイルとして
# 別の cargo の実行でビルドする（`cargo build --release -p genzo-worker --features libraw`）。本体は
# RAW のデコーダの識別子をワーカーの握手の応答から得るので、本体の genzo-raw の libraw は要らない。
libraw = ["genzo-worker/libraw"]

[lib]
path = "src/lib.rs"

# 本体の実行ファイル自身を隠しサブコマンド（`__worker`）でワーカーとして起動する構成（genzo-cli と同じ形）を
# 確かめる最小の実行ファイル。結合テスト（tests/）が `CARGO_BIN_EXE_genzo-api-worker` で使う。
[[bin]]
name = "genzo-api-worker"
path = "src/bin/genzo-api-worker.rs"

[dependencies]
genzo-model.workspace = true
genzo-catalog.workspace = true
genzo-pipeline.workspace = true
genzo-gpu.workspace = true
genzo-jobs.workspace = true
genzo-worker.workspace = true
genzo-media.workspace = true
genzo-color.workspace = true
genzo-raw.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
trash.workspace = true
blake3.workspace = true
# render_deps のカメラ行列の内容のハッシュ（SHA-256。04 の 2.5 節）。
sha2.workspace = true
# 撮影日時・バックアップの日時。
chrono.workspace = true
# イベントのチャネル（コア → UI。04 の 1.5 節）。
crossbeam-channel.workspace = true
# 状態のロック（毒されない Mutex と、自動保存の待ち合わせの Condvar）。
parking_lot.workspace = true
# GPU から CPU への切り替えなどの記録。
tracing.workspace = true
# ログのファイル・標準エラーへの出力（`logging`。SYS-07。アプリと CLI が使う。workspace の依存で、新しい
# crate は増えない）。
tracing-subscriber.workspace = true
# 取り込みで、大文字・小文字だけが違う名前のフォルダが同じものかを確かめる（ファイルの識別子で比べる。F08）。
same-file.workspace = true
# コピー取り込みの一時ファイルと、上書きしない名前の変更（`persist_noclobber`。IMP-02）。genzo-media の安全な
# 書き出しと同じ crate・版（workspace の依存で、新しい crate は増えない）。
tempfile.workspace = true

# Windows: ゴミ箱へ移す前に、ドライブにごみ箱があるかを確かめる（SHQueryRecycleBinW。決定 No.23）。
# ネットワークのドライブかを確かめる（GetDriveTypeW。ファイルの内容のハッシュのバックグラウンドの計算。
# ORG-03。Win32_Storage_FileSystem は tempfile が既に同じ版で使っている機能）。ボリュームの ID とマウント先
# （GetVolumePathNameW・GetVolumeInformationW。FILE-03）と、調べる間にメディアのないドライブで OS の確認の画面を
# 出さない（SetThreadErrorMode。Win32_System_Diagnostics_Debug）。
# Microsoft の Win32 API の宣言だけの crate。版は依存の木に既にあるもの（Cargo.lock）と同じ。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
] }

# Linux・macOS: ボリュームがネットワークのファイルシステムかを確かめる（statfs。ORG-03）。版は依存の木に既に
# あるもの（genzo-worker・genzo-cli と同じ）。
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
# 古い版のカタログを作って、コアが開いたときの移行を確かめる（`genzo_catalog::testing`）。
genzo-catalog = { workspace = true, features = ["test-support"] }
# 合成の JPEG / PNG / TIFF（テストの入力）と、書き出したファイルの寸法の確認。
image.workspace = true
# 書き出したファイルの Exif（GPS の有無）の確認。
kamadak-exif.workspace = true
# 合成 DNG（ベイヤー配列のモザイク化と DNG の書き出し）。
genzo-testkit.workspace = true
# 透かしの文字のテスト（EXP-03）に使うフォントを作る（`genzo_media::testing`。workspace の crate で、新しい crate は
# 増えない）。
genzo-media = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
