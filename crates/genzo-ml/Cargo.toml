[package]
name = "genzo-ml"
description = "GenzoParis の ML 推論（ONNX Runtime の抽象と、AI マスクの推論。DEV-20。04 の 7.2 節）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["onnx"]
# ONNX Runtime（ort）の backend。外すと、推論は差し替えの backend（テスト用など）だけになる。
onnx = ["dep:ort"]

[dependencies]
# AI マスクの種類（AiMaskKind）と SHA-256。
genzo-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
hex.workspace = true
sha2.workspace = true
# ONNX Runtime（実行時に共有ライブラリを読み込む。理由はルートの Cargo.toml の注）。
ort = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
