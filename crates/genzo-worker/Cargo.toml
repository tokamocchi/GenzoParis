[package]
name = "genzo-worker"
description = "GenzoParis のワーカープロセス（RAW の展開・メタデータ）と、本体側の管理"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# ワーカーで LibRaw による RAW の展開を有効にする。
libraw = ["genzo-raw/libraw"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "genzo-worker"
path = "src/main.rs"

[dependencies]
genzo-raw.workspace = true
genzo-media.workspace = true
genzo-model.workspace = true
# RAW 以外の画像をリニア BT.2020（B2）に変換する（lcms2。04 の 2.6 節「RAW 以外の入力」）。
genzo-color.workspace = true
# 取り消しトークン（04 の 6.1 節）。
genzo-jobs.workspace = true
serde.workspace = true
serde_json.workspace = true
memmap2.workspace = true
# 共有メモリのデータを、本体の Vec<u16> / Vec<[f32; 3]> に直接読む（unsafe を使わずにバイト列として見る）。
bytemuck.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# 応答・取り消し・タイムアウトを同時に待つ（select）。
crossbeam-channel.workspace = true
# 異常終了・タイムアウトと、ワーカーの標準エラー出力の記録（本体のログ。SYS-07。workspace の依存で、新しい
# crate は増えない）。
tracing.workspace = true

# ワーカーのメモリの上限（setrlimit。Linux だけ。04 の 1.2 節、AR-10）と、ワーカーと孫プロセスを
# プロセスグループでまとめて終わらせる（killpg。Linux・macOS。決定 No.12）。
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

# Windows: ワーカーと孫プロセスをジョブオブジェクトでまとめて終わらせ、メモリの上限をかける
# （決定 No.12）。Microsoft の Win32 API の宣言だけの crate。版は依存の木に既にあるもの（Cargo.lock）と同じ。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints]
workspace = true
