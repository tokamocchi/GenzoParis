[package]
name = "genzo-worker"
description = "GenzoParis のワーカープロセス（RAW の展開・メタデータ）と、本体側の管理"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# ワーカーで LibRaw による RAW の展開を有効にする。
libraw = ["genzo-raw/libraw"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "genzo-worker"
path = "src/main.rs"

[dependencies]
genzo-raw.workspace = true
genzo-media.workspace = true
genzo-model.workspace = true
serde.workspace = true
serde_json.workspace = true
memmap2.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[lints]
workspace = true
