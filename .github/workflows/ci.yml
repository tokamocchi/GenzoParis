# GenzoParis の CI（個人開発のため最小限）。
#
# - lint: フォーマットの確認と、依存クレートのライセンス・脆弱性・重複・取得元の確認（cargo-deny。設定は deny.toml）
# - ui: 画面（ui/）の型の検査・テスト・ビルドと、配布のスクリプト（scripts/）のテスト（Linux。Node だけを使う）。
#   画面の npm のパッケージのライセンスの文書（crates/genzo-app/licenses/third-party/npm.txt）が最新か、画面の
#   バンドルに入ったパッケージがすべて載っているかも確かめる（DIST-05）
# - third-party: 配布物に入れる Rust の crate のライセンスの文書（crates/genzo-app/licenses/third-party/rust.txt）を
#   cargo-about で作り直し、リポジトリのものと同じかを確かめる（DIST-05。docs/third_party.md の 1.4 節）
# - test: Windows と macOS（Apple Silicon）で、clippy（警告をエラーとして扱う）とテスト。デスクトップアプリ
#   （genzo-app。Tauri 2）も含む。genzo-app は既定の機能フラグでは画面のビルド結果（ui/dist）を埋め込まず、
#   tauri.conf.json の devUrl を使うので、画面をビルドしなくてもビルドできる（tauri-codegen の context.rs）。
#
# Linux では Rust の genzo-app をビルドしない（GTK・WebKitGTK の開発用のパッケージが要るため。lint は cargo fmt と
# cargo-deny だけで、コンパイルしない）。配布物（インストーラー）は release.yml で作る。
#
# 対応する要件: docs/02 の MAINT-04（静的な検査）・MAINT-06（両 OS での CI）・SEC-04（依存ライブラリの管理）、
# docs/05 の 3 章 M0 タスク 5・6。
# C / C++ のライブラリ・同梱データ・外部の実行ファイルは cargo-deny では確認できないため、docs/third_party.md で管理する。
# GPU のない CI では CPU 基準実装でテストする（MAINT-02）。

name: CI

on:
  push:
  pull_request:

# 同じ ref で新しい実行が始まったら、古い実行を取り消す。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # dtolnay/rust-toolchain は、参照（@stable）が Rust の版の指定を兼ねる（メジャー版のタグはない）。
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable（2026-10-12 のブランチの先頭）
        with:
          components: rustfmt
      - name: フォーマットの確認
        run: cargo fmt --all --check
      - name: 依存クレートの確認（cargo-deny）
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories bans sources

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # setup-node は checkout@v5 と同じく Node 24 で動く版の系列（v5）。
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: 依存を入れる
        run: npm ci
      - name: 型の検査
        run: npm run typecheck
      - name: テスト
        run: npm test
      - name: ビルド
        run: npm run build
      # npm.txt が今の package-lock.json・node_modules から作ったものと同じか。画面のバンドル（Vite の build.license の
      # 出力 ui/dist/.vite/license.json）に入ったパッケージが、すべて載っているか。
      - name: 画面の npm のパッケージのライセンスの文書の確認
        working-directory: .
        run: node scripts/third-party.mjs --check --only npm --vite
      - name: 配布のスクリプトのテスト
        working-directory: .
        run: node --test "scripts/**/*.test.mjs"

  third-party:
    runs-on: ubuntu-latest
    env:
      # scripts/lib/third-party.mjs の CARGO_ABOUT_VERSION と同じ版（scripts/workflows.test.mjs で確かめる）。
      # 0.9.2 は 2026-08-18 の公開（EmbarkStudios。cargo-deny と同じ作者）。
      CARGO_ABOUT_VERSION: "0.9.2"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable（2026-10-12 のブランチの先頭）
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # ~/.cargo/bin（入れた cargo-about）と crate のソースを残す（cache-bin の既定は true）。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # crates.io から、版を固定して入れる（--locked で cargo-about の Cargo.lock のとおりにビルドする）。キャッシュに
      # 同じ版があれば入れ直さない。
      - name: cargo-about を入れる
        shell: bash
        run: |
          if [ "$(cargo about --version 2>/dev/null)" != "cargo-about ${CARGO_ABOUT_VERSION}" ]; then
            cargo install cargo-about --version "${CARGO_ABOUT_VERSION}" --locked --features cli
          fi
          cargo about --version
      # rust.txt が今の Cargo.lock・about.toml から作ったものと同じか。違えば、node scripts/third-party.mjs を
      # 実行して作り直した文書をコミットする。
      - name: Rust の crate のライセンスの文書の確認
        run: node scripts/third-party.mjs --check --only rust

  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest は Apple Silicon（arm64）のランナー。
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable（2026-10-12 のブランチの先頭）
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: テスト
        run: cargo test --workspace --locked

      # macOS だけ、Homebrew の LibRaw を入れて、機能フラグ libraw を有効にしても確認する。
      # genzo-cli/libraw を指定すると genzo-api・genzo-worker・genzo-raw の libraw も有効になる。
      # Windows での LibRaw の入手方法は未定のため、Windows は既定の機能フラグ（LibRaw なし）だけ。
      - name: LibRaw を入れる（macOS）
        if: runner.os == 'macOS'
        # pkg-config は genzo-raw の build.rs が LibRaw を探すために使う。ランナーに既にある場合は
        # そのまま使う（Homebrew の pkg-config@0.29.2 と pkgconf は同時に入れられないため）。
        run: |
          brew install libraw
          command -v pkg-config >/dev/null || brew install pkgconf
          pkg-config --modversion libraw
      - name: clippy（libraw）
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets --locked --features genzo-cli/libraw -- -D warnings
      - name: テスト（libraw）
        if: runner.os == 'macOS'
        run: cargo test --workspace --locked --features genzo-cli/libraw
