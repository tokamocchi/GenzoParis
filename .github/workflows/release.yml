# GenzoParis の配布物（インストーラー）を作る（SYS-08。手順と注意は docs/packaging.md）。
#
# - 起動: 手動（workflow_dispatch）だけ。タグ（v0.1.0 など）を選んで実行すると版を確かめる。タグの push では
#   動かさない（成果物の置き場の公開の範囲を、実行する人がその都度確かめるため。下の「公開の範囲の確認」）
# - Windows（windows-latest）: NSIS のインストーラー（ユーザーごとのインストール。tauri.conf.json）
# - macOS（macos-latest。Apple Silicon）: .dmg（と、.app を tar.gz にしたもの）
# - 署名・公証はしない（社内の数名への配布。macOS はアドホック署名だけ。tauri.bundle.conf.json）
# - 成果物は Actions の artifact に置く。タグを選んで実行したときは、さらに release ジョブが、そのタグの GitHub の
#   Releases に「下書き（draft）」のプレリリースとして載せる（SHA256SUMS.txt 付き。公開するかは人の判断。下の release ジョブ）
#
# 手順（OS ごと）: 公開の範囲の確認 →（タグのときは版の確認）→ 画面のビルド → LibRaw を入れる → ワーカーのビルドと LibRaw の収集
# （LGPL-2.1 の全文・案内を含む。scripts/prepare-worker.mjs）→ tauri build --config tauri.bundle.conf.json --config binaries/tauri.libs.conf.json
# （scripts/build-app.mjs。第三者のライセンスの文書が今の lock のファイルから作ったものかと、画面のバンドルに入った
# npm のパッケージがすべて載っているかも確かめる）→ 確認（ワーカーが同梱の LibRaw で起動できるか。ライセンスの文書が
# 入っているか）→ artifact に置く。その前に licenses ジョブ（Linux）で、Rust の crate のライセンスの文書を cargo-about で
# 作り直して比べる（通らなければ配布物を作らない）。
# Windows は、ワーカーと LibRaw の DLL が使う Visual C++ のランタイムの DLL も同梱する（ランナーの Visual Studio の
# 再頒布用のフォルダから。決定事項ログ No.73）。
# 確認に通らなかった配布物は、配る用の artifact には置かない（調べるために「-unverified」の名前で置く）。
#
# 実行の記録: 2026-10-12 に main（c0681eb）で 2 回実行した。1 回目（run 38263152398）は Windows が通り、macOS は
# 同梱する dylib が macOS 26.0 向け（minos 26.0）のため止まった。2 回目（run 38276847388。allow_newer_macos_libs に
# 印を付けた。配る相手の Mac はすべて macOS 26 以降。決定事項ログ No.74）で、両 OS の配布物ができ、確認の手順が
# 通った。Windows・macOS の実機での確認はまだ（docs/m5_acceptance.md）。
# シェルの変数のすぐ後に全角の文字を書くときは `${名前}` で囲む（macOS のランナーの bash は、全角の文字の先頭の
# バイトまで変数名として読むことがある。scripts/workflows.test.mjs）。

name: Release

on:
  workflow_dispatch:
    inputs:
      # macOS: Homebrew の dylib は、ランナーの macOS の版向けの bottle なので、tauri.conf.json の
      # minimumSystemVersion（12.0）より新しい macOS 向けになりうる。その場合、既定ではエラーにする（配る相手の
      # macOS の版は人の判断。docs/packaging.md の 2.3）。印を付けると通し、.app の最小の版を同梱したものに合わせて
      # 上げる（artifact の名前に「-macos<版>-or-later」が付く）。
      allow_newer_macos_libs:
        description: "macOS: 同梱する dylib に合わせて、.app の最小の macOS の版を上げてよい（配る相手の Mac がすべてその版以降のときだけ）"
        type: boolean
        default: false
      # 公開（public）のリポジトリでは、Actions の artifact は GitHub にログインした誰でも取得できる。配布物を
      # 社外に出してよいか（LibRaw の LGPL などの条件、署名のない配布物）の確認が済んでいなければ、実行しない。
      # 印がないと、公開のリポジトリでは最初の段階で止める（非公開のリポジトリでは見ない）。
      allow_public_artifacts:
        description: "公開のリポジトリで実行する: 配布物（artifact）を GitHub にログインした誰でも取得できる状態にしてよいことを、配布の責任者が確認した"
        type: boolean
        default: false
      # タグを選んで実行したとき、GitHub の Releases に載せる Release を、下書き（draft）にするか。既定は下書き
      # （本文の変更点・数値を人が確かめてから公開するため）。印を外すと、すぐ公開（プレリリース）になる。
      release_draft:
        description: "タグを選んで実行したとき: Releases には下書き（draft）で載せる（印を外すと、すぐ公開のプレリリースになる）"
        type: boolean
        default: true

# 同じ ref の配布物の作成は、新しいものが始まっても取り消さない（途中の成果物を捨てないため）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 配布物に入れる Rust の crate のライセンスの文書（crates/genzo-app/licenses/third-party/rust.txt）が、今の
  # Cargo.toml・Cargo.lock・about.toml から cargo-about で作ったものと同じかを確かめる（ci.yml の third-party ジョブと
  # 同じ。DIST-05。docs/third_party.md の 1.4 節）。配布のビルド（scripts/build-app.mjs）は cargo-about を使わずに
  # Cargo.lock・about.toml の SHA-256 だけを比べるので、Cargo.toml の機能フラグ・対象の OS ごとの依存の変更
  # （Cargo.lock は変わらないことがある）を見逃しうる。配布物を作る前に、ここで作り直して比べる。
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # scripts/lib/third-party.mjs の CARGO_ABOUT_VERSION と同じ版（scripts/workflows.test.mjs で確かめる）。
      CARGO_ABOUT_VERSION: "0.9.2"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable（2026-10-12 のブランチの先頭）
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo-about を入れる
        shell: bash
        run: |
          if [ "$(cargo about --version 2>/dev/null)" != "cargo-about ${CARGO_ABOUT_VERSION}" ]; then
            cargo install cargo-about --version "${CARGO_ABOUT_VERSION}" --locked --features cli
          fi
          cargo about --version
      - name: Rust の crate のライセンスの文書の確認
        run: node scripts/third-party.mjs --check --only rust

  bundle:
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: genzoparis-windows-x64
          # macos-latest は Apple Silicon（arm64）のランナー。Intel の Mac 向けは作らない（要るかは人の判断）。
          - os: macos-latest
            bundles: app,dmg
            artifact: genzoparis-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      # 公開のリポジトリでは、artifact を誰でも取得できる（上の allow_public_artifacts）。印がなければ、何も
      # 作らずに止める（docs/packaging.md の 2.5）。
      - name: 公開の範囲の確認
        if: github.event.repository.private == false && !inputs.allow_public_artifacts
        shell: bash
        run: |
          echo "::error::このリポジトリは公開（public）です。作った配布物（artifact）は GitHub にログインした誰でも取得できます。配布の責任者が公開の範囲を確認してから、allow_public_artifacts に印を付けて実行してください（docs/packaging.md の 2.5）。"
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Rust の版は rust-toolchain.toml（1.97.0）が決める。
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable（2026-10-12 のブランチの先頭）
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # setup-node は ci.yml と同じ版の系列（v5）。
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # タグ（v0.2.0 など）を選んで実行したときは、タグの版と配布物の版（tauri.conf.json の version。ファイル名・
      # Info.plist・インストーラーの版になる）と Cargo の版（本体・ワーカーの版）が同じかを確かめる
      # （違う版の名前の配布物を作らないため）。
      - name: タグと版を比べる
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./crates/genzo-app/tauri.conf.json').version")
          crates=$(cargo metadata --format-version 1 --no-deps --locked | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const m = JSON.parse(s);
              console.log(["genzo-app", "genzo-worker"].map((n) => m.packages.find((p) => p.name === n).version).join(" "));
            });')
          echo "タグ: $tag / tauri.conf.json: $conf / Cargo（genzo-app genzo-worker）: $crates"
          for v in $conf $crates; do
            if [ "$v" != "$tag" ]; then
              echo "::error::タグの版（${tag}）と、tauri.conf.json・Cargo の版（${conf} / ${crates}）が違う。版を直してからタグを付け直す"
              exit 1
            fi
          done

      - name: 画面の依存を入れる
        working-directory: ui
        run: npm ci
      # 型の検査を含む（npm run build）。tauri build も beforeBuildCommand で同じビルドをもう一度行うが、
      # 時間のかかる Rust のビルドの前に画面の誤りで止めるため、先に実行する。
      - name: 画面のビルド
        working-directory: ui
        run: npm run build

      # vcpkg はランナーに入っている（VCPKG_INSTALLATION_ROOT）。libraw の port は、スレッドセーフな版を
      # lib/raw_r.lib・bin/raw_r.dll に置く（scripts/lib/bundle.mjs）。依存（jasper・lcms・zlib・libjpeg-turbo）も
      # ソースからビルドするため時間がかかる（バイナリのキャッシュは未設定）。
      - name: LibRaw を入れる（Windows。vcpkg）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libraw:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install が失敗した" }
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\*.lib", "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll"
      # pkg-config は genzo-raw の build.rs が LibRaw を探すために使う（ci.yml と同じ）。
      - name: LibRaw を入れる（macOS。Homebrew）
        if: runner.os == 'macOS'
        run: |
          brew install libraw
          command -v pkg-config >/dev/null || brew install pkgconf
          pkg-config --modversion libraw_r

      # LIBRAW_INCLUDE_DIR などがなければ、VCPKG_INSTALLATION_ROOT の installed/x64-windows を使う（Windows）。
      # macOS では、同梱するものの最小の版をステップの出力（macos_min_version・macos_min_raised）と summary に書く。
      - name: ワーカーのビルドと LibRaw の収集
        id: worker
        env:
          GENZO_ALLOW_NEWER_MINOS: ${{ inputs.allow_newer_macos_libs && '1' || '0' }}
        run: node scripts/prepare-worker.mjs
      # cargo には --locked を付ける（Cargo.lock を変えずにビルドする。scripts/lib/build.mjs）。
      - name: インストーラーを作る
        run: node scripts/build-app.mjs --skip-worker --bundles ${{ matrix.bundles }}

      # upload-artifact はファイルの実行の権限を保たないため、.app はそのまま置かずに tar.gz にする。
      - name: .app をまとめる（macOS）
        if: runner.os == 'macOS'
        run: tar -czf target/release/bundle/GenzoParis.app.tar.gz -C target/release/bundle/macos GenzoParis.app

      # 確認: 配布物の中のワーカーが、同梱の LibRaw で起動できるか（DLL・dylib が見つからなければ起動しない）。
      # 成果物を置く前に行い、通らなければ配る用の artifact に置かない。
      # 2026-10-12 の実行（run 38276847388）で、両 OS とも通った（上の「実行の記録」）。
      - name: 確認（Windows。無人インストールしてワーカーを起動する）
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "インストーラーがない" }
          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "インストーラーが失敗した（終了コード $($p.ExitCode)）" }
          # インストール先（ユーザーごとのインストールの既定。実機で未確認）。
          $dir = Join-Path $env:LOCALAPPDATA 'GenzoParis'
          Get-ChildItem $dir
          # 同梱の一覧（scripts/prepare-worker.mjs が作る bundled-libs.txt）の DLL が、すべてインストール先にあるか。
          # Visual C++ のランタイムはランナーの OS のフォルダにもあるので、起動の確認だけでは同梱の漏れを見逃す。
          $listed = Get-Content crates/genzo-app/binaries/bundled-libs.txt |
            Where-Object { $_ -notmatch '^#' -and $_.Trim() -ne '' } |
            ForEach-Object { ($_ -split "`t")[0] } |
            Where-Object { $_ -like '*.dll' }
          if (-not ($listed | Where-Object { $_ -match '^vcruntime\d+\.dll$' })) { throw "同梱の一覧に Visual C++ のランタイムがない" }
          foreach ($name in $listed) {
            if (-not (Test-Path (Join-Path $dir $name))) { throw "同梱したはずの $name がインストール先にない" }
          }
          Write-Output "インストール先にある同梱の DLL: $($listed -join ', ')"
          # LibRaw の LGPL-2.1 の全文・著作権表示・案内（scripts/lib/notice.mjs）が、インストール先にあるか。
          foreach ($name in 'LICENSE.LGPL', 'COPYRIGHT', 'README.txt') {
            $f = Join-Path $dir "licenses\LibRaw\$name"
            if (-not (Test-Path $f)) { throw "LibRaw のライセンスの文書 $name がインストール先にない" }
          }
          # アプリ自体のライセンス（GPL-3.0）と、第三者のライセンスの文書（Rust の crate・画面の npm のパッケージ。
          # scripts/third-party.mjs。tauri.conf.json の resources）が、インストール先にあるか。
          foreach ($name in 'README.txt', 'GenzoParis\LICENSE.txt', 'third-party\rust.txt', 'third-party\npm.txt') {
            $f = Join-Path $dir "licenses\$name"
            if (-not (Test-Path $f)) { throw "ライセンスの文書 licenses\$name がインストール先にない" }
          }
          # 同梱した C / C++ のライブラリのライセンスの文書（scripts/lib/native-notice.mjs）がインストール先にあり、
          # 同梱の一覧の DLL がすべて載っているか。LibRaw のソースのアーカイブ（licenses\LibRaw\source）があるか。
          # Visual C++ のランタイムの使用条件（インストーラーで同意を求めたもの。scripts/lib/worker.mjs）。
          if (-not (Test-Path (Join-Path $dir 'licenses\third-party\vcruntime-terms.txt'))) {
            throw "Visual C++ のランタイムの使用条件 licenses\third-party\vcruntime-terms.txt がインストール先にない"
          }
          $nativeFile = Join-Path $dir 'licenses\third-party\native.txt'
          if (-not (Test-Path $nativeFile)) { throw "ライセンスの文書 licenses\third-party\native.txt がインストール先にない" }
          $native = Get-Content $nativeFile -Raw -Encoding utf8
          foreach ($name in $listed) {
            if (-not $native.Contains("  ${name}: ")) { throw "native.txt に同梱の ${name} が載っていない" }
          }
          $sources = @(Get-ChildItem (Join-Path $dir 'licenses\LibRaw\source') -Filter '*.tar.gz' -ErrorAction SilentlyContinue)
          if ($sources.Count -eq 0) { throw "LibRaw のソースのアーカイブが licenses\LibRaw\source にない" }
          Write-Output "LibRaw のソース: $($sources.Name -join ', ')"
          Get-Content (Join-Path $dir 'licenses\LibRaw\README.txt') -Encoding utf8 | Select-Object -First 5
          # AI マスク（DEV-20）: 同梱のモデルと台帳（crates/genzo-app/models。tauri.conf.json の resources）・ONNX Runtime
          # （scripts/lib/onnxruntime.mjs）・それらのライセンスの文書が、インストール先にあるか。ONNX Runtime を読み込めて、
          # 版が固定した版か（scripts/check-onnxruntime.py。ランナーの Python で読み込むだけ。推論はしない）。
          foreach ($name in 'u2netp.onnx', 'u2netp-subject.genzo-model.json', 'deeplab_v3.onnx', 'deeplab-v3-person.genzo-model.json', 'onnxruntime.dll') {
            if (-not (Test-Path (Join-Path $dir "models\${name}"))) { throw "AI マスクの models\${name} がインストール先にない" }
          }
          foreach ($name in 'third-party\ai-models.txt', 'third-party\onnxruntime\LICENSE.txt', 'third-party\onnxruntime\ThirdPartyNotices.txt') {
            if (-not (Test-Path (Join-Path $dir "licenses\${name}"))) { throw "ライセンスの文書 licenses\${name} がインストール先にない" }
          }
          $ortExpected = node --input-type=module -e "import('./scripts/lib/onnxruntime.mjs').then((m) => console.log(m.ONNXRUNTIME_VERSION))"
          $env:PYTHONUTF8 = '1'
          python scripts/check-onnxruntime.py (Join-Path $dir 'models\onnxruntime.dll') $ortExpected
          if ($LASTEXITCODE -ne 0) { throw "同梱の ONNX Runtime を読み込めない、または版が違う（期待 ${ortExpected}）" }
          # DLL をインストール先と OS のフォルダからだけ探すよう、PATH を OS のフォルダだけにして起動する
          # （ランナーの PATH に LibRaw などの DLL があると、同梱の漏れを見逃すため）。
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $out = & (Join-Path $dir 'genzo-worker.exe') --version
          $code = $LASTEXITCODE
          Write-Output $out
          # DLL が見つからないときは、終了コードが -1073741515（0xC0000135）になる。
          if ($code -ne 0) { throw "genzo-worker.exe が起動しない（終了コード $($code)）" }
          if (-not (@($out) -match '^genzo-worker \d')) { throw "genzo-worker.exe の版が出ない" }
      # shell: bash を指定する（-o pipefail も付く。指定しないと bash -e だけで動く）。
      - name: 確認（macOS。署名とワーカーの起動）
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 10
        env:
          # .app の最小の版（tauri.conf.json の版、または allow_newer_macos_libs で上げた版。scripts/lib/worker.mjs）。
          EXPECTED_MIN_MACOS: ${{ steps.worker.outputs.macos_min_version }}
        run: |
          # 絶対パスで起動する（dyld の記録のパスを、下の比べる形に合わせるため）。
          app="$PWD/target/release/bundle/macos/GenzoParis.app"
          logs=target/verify-logs
          mkdir -p "$logs"
          ls -la "$app/Contents/MacOS" "$app/Contents/Frameworks"
          otool -L "$app/Contents/MacOS/genzo-worker"
          codesign --verify --deep --strict --verbose=2 "$app"
          # .app の最小の版が、同梱した dylib に合っているか（上げ忘れると、古い macOS で RAW を開けない）。
          min_actual=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")
          echo "LSMinimumSystemVersion: ${min_actual}（期待: ${EXPECTED_MIN_MACOS}）"
          if [ "$min_actual" != "$EXPECTED_MIN_MACOS" ]; then
            echo "::error::.app の最小の版（${min_actual}）が、同梱するものに合わせた版（${EXPECTED_MIN_MACOS}）と違う"; exit 1
          fi
          # LibRaw の LGPL-2.1 の全文・著作権表示・案内（scripts/lib/notice.mjs）が、.app の中にあるか。
          for name in LICENSE.LGPL COPYRIGHT README.txt; do
            if [ ! -f "$app/Contents/Resources/licenses/LibRaw/$name" ]; then
              echo "::error::LibRaw のライセンスの文書 ${name} が .app の Contents/Resources/licenses/LibRaw にない"; exit 1
            fi
          done
          # アプリ自体のライセンス（GPL-3.0）と、第三者のライセンスの文書（scripts/third-party.mjs。tauri.conf.json の
          # resources）が、.app の中にあるか。
          for name in README.txt GenzoParis/LICENSE.txt third-party/rust.txt third-party/npm.txt; do
            if [ ! -f "$app/Contents/Resources/licenses/$name" ]; then
              echo "::error::ライセンスの文書 licenses/${name} が .app の Contents/Resources にない"; exit 1
            fi
          done
          head -5 "$app/Contents/Resources/licenses/LibRaw/README.txt"
          # AI マスク（DEV-20）: 同梱のモデルと台帳（crates/genzo-app/models）・ONNX Runtime（scripts/lib/onnxruntime.mjs。
          # Contents/Frameworks ではなく資源のフォルダの models に置く）・それらのライセンスの文書が .app の中にあるか。
          # ONNX Runtime を読み込めて、版が固定した版か（scripts/check-onnxruntime.py。読み込むだけで推論はしない）。
          for name in u2netp.onnx u2netp-subject.genzo-model.json deeplab_v3.onnx deeplab-v3-person.genzo-model.json libonnxruntime.dylib; do
            if [ ! -f "$app/Contents/Resources/models/${name}" ]; then
              echo "::error::AI マスクの models/${name} が .app の Contents/Resources にない"; exit 1
            fi
          done
          for name in third-party/ai-models.txt third-party/onnxruntime/LICENSE.txt third-party/onnxruntime/ThirdPartyNotices.txt; do
            if [ ! -f "$app/Contents/Resources/licenses/${name}" ]; then
              echo "::error::ライセンスの文書 licenses/${name} が .app の Contents/Resources にない"; exit 1
            fi
          done
          ort_expected=$(node --input-type=module -e "import('./scripts/lib/onnxruntime.mjs').then((m) => console.log(m.ONNXRUNTIME_VERSION))")
          python3 scripts/check-onnxruntime.py "$app/Contents/Resources/models/libonnxruntime.dylib" "$ort_expected"
          shopt -s nullglob
          # 同梱した C / C++ のライブラリのライセンスの文書（scripts/lib/native-notice.mjs）が .app の中にあり、
          # Contents/Frameworks の dylib がすべて載っているか。LibRaw のソースのアーカイブ（licenses/LibRaw/source）があるか。
          native="$app/Contents/Resources/licenses/third-party/native.txt"
          if [ ! -f "$native" ]; then
            echo "::error::ライセンスの文書 licenses/third-party/native.txt が .app の Contents/Resources にない"; exit 1
          fi
          for lib in "$app"/Contents/Frameworks/*.dylib; do
            name=$(basename "$lib")
            if ! grep -qF "  ${name}: " "$native"; then
              echo "::error::native.txt に同梱の ${name} が載っていない"; exit 1
            fi
          done
          sources=("$app"/Contents/Resources/licenses/LibRaw/source/*.tar.gz)
          if [ ${#sources[@]} -eq 0 ]; then
            echo "::error::LibRaw のソースのアーカイブが .app の Contents/Resources/licenses/LibRaw/source にない"; exit 1
          fi
          echo "LibRaw のソース: ${sources[*]##*/}"
          dmgs=(target/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then echo "::error::.dmg がない"; exit 1; fi
          for dmg in "${dmgs[@]}"; do hdiutil verify "$dmg"; done

          # ワーカーを起動する。標準出力（版）と標準エラー（DYLD_PRINT_LIBRARIES の記録・dyld のエラー）を分けて取る。
          rc=0
          DYLD_PRINT_LIBRARIES=1 "$app/Contents/MacOS/genzo-worker" --version >"$logs/worker-stdout.log" 2>"$logs/worker-dyld.log" || rc=$?
          cat "$logs/worker-stdout.log" "$logs/worker-dyld.log"
          fail=0
          if [ "$rc" -ne 0 ]; then echo "::error::ワーカーが起動しない（終了コード ${rc}）"; fail=1; fi
          if grep -q "Library not loaded" "$logs/worker-dyld.log"; then
            echo "::error::ワーカーの依存の dylib が見つからない（Library not loaded）"; fail=1
          fi
          if ! grep -Eq '^genzo-worker [0-9]' "$logs/worker-stdout.log"; then echo "::error::ワーカーの版が出ない"; fail=1; fi

          # 読み込みの記録の行だけを取り出してパスにする。dyld4（macOS 12 以降）の形は "dyld[<pid>]: <UUID> <パス>"、
          # 古い形は "dyld: loaded: <UUID> <パス>"（どちらも実機で未確認）。dyld のエラーの文言
          # （"dyld[<pid>]: Library not loaded: …"・"  Referenced from: …"・"  Reason: tried: '…'"）は、この形に当たらない。
          sed -nE 's/^dyld(\[[0-9]+\])?: (loaded: )?(<[^>]*> )?(\/.*)$/\4/p' "$logs/worker-dyld.log" >"$logs/worker-loaded.txt"
          echo "読み込んだもの:"; cat "$logs/worker-loaded.txt"
          # Contents/Frameworks のすべての dylib を、.app の中から読み込んだか（@executable_path・@loader_path を
          # 展開したパスは「MacOS/../Frameworks」の形のこともあるので、両方を受け付ける）。
          libs=("$app"/Contents/Frameworks/*.dylib)
          if [ ${#libs[@]} -eq 0 ]; then echo "::error::Contents/Frameworks に dylib がない"; fail=1; fi
          raw=0
          for lib in "${libs[@]}"; do
            name=$(basename "$lib")
            case "$name" in libraw*) raw=1 ;; esac
            if ! grep -Fxq -e "$app/Contents/Frameworks/$name" -e "$app/Contents/MacOS/../Frameworks/$name" "$logs/worker-loaded.txt"; then
              echo "::error::$name を .app の中から読み込んでいない"; fail=1
            fi
          done
          if [ "$raw" -ne 1 ]; then echo "::error::Contents/Frameworks に LibRaw の dylib がない"; fail=1; fi
          # ランナーには Homebrew の LibRaw もあるため、.app の外（Homebrew の場所）から読み込んでいないかも見る。
          if grep -E '^(/opt/homebrew|/usr/local)/' "$logs/worker-loaded.txt"; then
            echo "::error::.app の外（Homebrew の場所）の dylib を読み込んでいる"; fail=1
          fi
          exit "$fail"

      # upload-artifact は Node 24 で動く最初の版の系列（v6）を使う（v5 は Node 20）。
      # macOS で .app の最小の版を上げたとき（allow_newer_macos_libs）は、名前に「-macos<版>-or-later」を付ける。
      - name: 成果物を置く
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact }}${{ steps.worker.outputs.macos_min_raised == '1' && format('-macos{0}-or-later', steps.worker.outputs.macos_min_version) || '' }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/GenzoParis.app.tar.gz
            crates/genzo-app/binaries/bundled-libs.txt
            crates/genzo-app/binaries/licenses/
          if-no-files-found: error
          # 仮置き: 30 日（配布が済んだら消えてよい）。
          retention-days: 30
      # 途中で失敗したときは、調べるために「-unverified」の名前で置く（配らない。仮置き: 7 日で消える）。
      - name: 成果物を置く（失敗したとき。調べる用）
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact }}-unverified
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/GenzoParis.app.tar.gz
            crates/genzo-app/binaries/bundled-libs.txt
            crates/genzo-app/binaries/licenses/
            target/verify-logs/
          if-no-files-found: ignore
          retention-days: 7

  # タグ（v0.2.1 など）を選んで実行したときだけ、両 OS の配布物がそろい、確認が通った後に、GitHub の Releases へ
  # プレリリースとして載せる（docs/packaging.md の 2.5）。載せるのは、インストーラー・.dmg・同梱ライブラリの一覧
  # （bundled-libs-*.txt）・SHA256SUMS.txt。.app の tar.gz とライセンスの文書のフォルダは載せない（インストーラーと
  # .dmg の中に入っている）。「-unverified」の artifact は載せない（bundle が全 OS で成功したときだけ動く）。
  # 外部のアクションは使わない（ランナーに入っている gh を、この実行の GITHUB_TOKEN で使う）。
  # 同じタグの Release がすでにあるときは、上書きせずに止める（公開済みの配布物と SHA-256 を変えないため）。
  release:
    needs: bundle
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Release を作る（contents: write）のはこのジョブだけ。artifact の取得に actions: read が要る。
    permissions:
      contents: write
      actions: read
    steps:
      - name: Release に載せる
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DRAFT: ${{ inputs.release_draft && '1' || '0' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::タグ ${TAG} の Release はすでにある。公開済みの配布物を変えないため、上書きしない（消す・別のタグにする・手で載せるのは人の判断）"
            exit 1
          fi
          mkdir dl
          # 配る用の artifact だけを取る（名前で選ぶ。「-unverified」は一致しない）。ジョブの再実行では、run の ID が同じまま
          # 前の試行の artifact が残る（失敗した試行の「-unverified」など）ため、全部を取って「ない」ことを求めない。
          # 名前が同じものや、同じ OS の artifact が 2 つ以上あるときは、下で止まる（古いものを載せないため）。
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern 'genzoparis-windows-x64' --pattern 'genzoparis-macos-arm64' --pattern 'genzoparis-macos-arm64-macos*-or-later'
          ls -R dl
          mkdir out
          shopt -s nullglob
          for os in windows-x64 macos-arm64; do
            dirs=(dl/genzoparis-${os}*)
            if [ ${#dirs[@]} -ne 1 ]; then
              echo "::error::${os} の artifact が 1 つではない（${#dirs[@]} 個: ${dirs[*]}）。再実行で古いものが残っていないか確かめる"; exit 1
            fi
          done
          # artifact の中のフォルダ構成（upload-artifact は共通の親から残す）に頼らず、find で探す。
          mapfile -t win < <(find dl/genzoparis-windows-x64* -name '*-setup.exe')
          mapfile -t dmg < <(find dl/genzoparis-macos-arm64* -name '*.dmg')
          if [ ${#win[@]} -ne 1 ] || [ ${#dmg[@]} -ne 1 ]; then
            echo "::error::インストーラー（${#win[@]} 件）・.dmg（${#dmg[@]} 件）が 1 件ずつではない"; exit 1
          fi
          cp "${win[0]}" "${dmg[0]}" out/
          for pair in "windows-x64:bundled-libs-windows-x64.txt" "macos-arm64:bundled-libs-macos-arm64.txt"; do
            os=${pair%%:*}; dest=${pair#*:}
            mapfile -t libs < <(find dl/genzoparis-${os}* -name bundled-libs.txt)
            if [ ${#libs[@]} -ne 1 ]; then echo "::error::${os} の bundled-libs.txt が 1 件ではない（${#libs[@]} 件）"; exit 1; fi
            cp "${libs[0]}" "out/${dest}"
          done
          (cd out && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          mv SHA256SUMS.txt out/
          # 本文は、事実だけを書く。変更点は人が足す（下書きのうちに編集する）。
          macdir=${dmg[0]#dl/}; macdir=${macdir%%/*}
          {
            echo "GenzoParis ${TAG#v}（\`${GITHUB_SHA:0:7}\`）の配布物です。"
            echo
            echo "- 作成: GitHub Actions の Release ワークフロー（${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}）。両 OS とも、配布物の中のワーカーが同梱の LibRaw で起動できることを、ワークフローの中で確かめています。"
            echo "- **署名・公証はしていません。** Windows では SmartScreen の警告が、macOS では Gatekeeper の警告が出ることがあります。"
            echo "- Windows・macOS の実機での受け入れの確認は、まだです（docs/m5_acceptance.md）。"
            echo "- macOS の配布物の artifact 名: \`${macdir}\`（名前に \`-macos<版>-or-later\` があれば、その版以降の macOS が必要です）。"
            echo "- 同梱の LibRaw は LGPL-2.1 です。全文・案内は配布物の中の \`licenses/\` にあります。"
            echo "- ファイルの SHA-256 は \`SHA256SUMS.txt\` にあります。"
            echo
            echo "## 変更点"
            echo
            echo "（公開の前に書く）"
          } > notes.md
          flags=(--prerelease --verify-tag --title "GenzoParis ${TAG#v}" --notes-file notes.md)
          if [ "$DRAFT" = "1" ]; then flags+=(--draft); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" out/*
